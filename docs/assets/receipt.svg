<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" role="img" aria-label="A landing commit&#x27;s receipt: task, contract hash, builder, challenger, checks and verdict.">
<title>A landing commit&#x27;s receipt: task, contract hash, builder, challenger, checks and verdict.</title>
<style>
.s{font-family:'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:'Cascadia Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes draw{from{stroke-dashoffset:1.05}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
.tk{animation:feed 1.5s cubic-bezier(.3,.6,.2,1) .2s both}
@keyframes feed{from{transform:translateY(-352px)}}
.r0{animation:fade .4s ease-out 1.00s both}
.r1{animation:fade .4s ease-out 1.18s both}
.r2{animation:fade .4s ease-out 1.36s both}
.r3{animation:fade .4s ease-out 1.54s both}
.r4{animation:fade .4s ease-out 1.72s both}
.r5{animation:fade .4s ease-out 1.90s both}
.r6{animation:fade .4s ease-out 2.08s both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
