<radialGradient id="hw"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#f5b041" stop-opacity=".9"/><stop offset="1" stop-color="#f5b041" stop-opacity="0"/></radialGradient>
<radialGradient id="hc"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#5cc8f2" stop-opacity=".9"/><stop offset="1" stop-color="#5cc8f2" stop-opacity="0"/></radialGradient>
<radialGradient id="hx"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 1 9 5 0 9z" fill="#8da2b9"/></marker>
<clipPath id="feed"><rect x="0" y="86" width="960" height="362"/></clipPath>
