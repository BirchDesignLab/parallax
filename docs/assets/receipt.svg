437L166 428L159 437L152 428L145 437L138 428L131 437L124 428L117 437L110 428L103 437L96 428L89 437L82 428L75 437L68 428L61 437L54 428L47 437L40 428L40 428Z" fill="url(#grain)"/><text x="68" y="148" class="m r0" font-size="22"><tspan fill="#8da2b9">293c8db  </tspan><tspan fill="#e9eff6" font-weight="600">clamp-001: Add clamp(x, lo, hi) to clamplib</tspan></text><path d="M68 170H894" stroke="#2c4361" stroke-width="1.4" stroke-dasharray="6 5"/><text x="68" y="208" class="m r1" font-size="22"><tspan fill="#8da2b9">Parallax-Task:</tspan></text><text x="318.8" y="208" class="m r1" font-size="22" fill="#e9eff6">clamp-001</text><text x="68" y="246" class="m r2" font-size="22"><tspan fill="#8da2b9">Parallax-Contract:</tspan></text><text x="318.8" y="246" class="m r2" font-size="22" fill="#e9eff6">sha256:c317c9e49ac1...6a93fe083</text><text x="68" y="284" class="m r3" font-size="22"><tspan fill="#8da2b9">Built-by:</tspan></text><text x="318.8" y="284" class="m r3" font-size="22" fill="#5cc8f2">codex gpt-6.2-astra/xhigh</text><text x="68" y="322" class="m r4" font-size="22"><tspan fill="#8da2b9">Challenged-by:</tspan></text><text x="318.8" y="322" class="m r4" font-size="22" fill="#f5b041">claude fable/high</text><text x="68" y="360" class="m r5" font-size="22"><tspan fill="#8da2b9">Checks:</tspan></text><text x="318.8" y="360" class="m r5" font-size="22" fill="#e9eff6">84 probes passed, 3 of 3 mutants caught</text><text x="68" y="398" class="m r6" font-size="22"><tspan fill="#8da2b9">Verdict:</tspan></text><text x="318.8" y="398" class="m r6" font-size="23" fill="#ffffff" font-weight="700">consensus</text></g></g>
<rect x="24" y="74" width="912" height="24" rx="12" fill="#04080e" stroke="#2c4361"/>
<rect x="44" y="93" width="872" height="4" rx="2" fill="url(#fold)"/>
<text x="40" y="494" class="s" font-size="23" fill="#c3d0de" font-weight="600">The verdict says how it got there</text>
<circle cx="50" cy="535" r="4.5" fill="#fff"/>
<text x="64" y="542" class="m" font-size="23" fill="#e9eff6" font-weight="600">consensus</text>
<text x="64" y="570" class="s" font-size="21" fill="#8da2b9">clean at the first crossing</text>
<text x="64" y="610" class="m" font-size="23" fill="#c3d0de">resolved</text>
<text x="64" y="638" class="s" font-size="21" fill="#8da2b9">a failed crossing, repaired by the seats</text>
<text x="64" y="678" class="m" font-size="23" fill="#c3d0de">ruled</text>
<text x="64" y="706" class="s" font-size="21" fill="#8da2b9">a human ruling was needed</text>
<text x="504" y="542" class="m" font-size="23" fill="#c3d0de">limited</text>
<text x="504" y="570" class="s" font-size="21" fill="#8da2b9">accepted with a stated limitation</text>
<text x="504" y="610" class="m" font-size="23" fill="#c3d0de">solo</text>
<text x="504" y="638" class="s" font-size="21" fill="#8da2b9">a chore, built by one seat</text>
<text x="40" y="750" class="s" font-size="21" fill="#8da2b9">The receipt of the first real run with the settlement, 2026-11-23.</text>
<text x="40" y="778" class="s" font-size="21" fill="#8da2b9">Hash shortened to fit.</text>
<rect width="960" height="5" fill="url(#fold)"/>
