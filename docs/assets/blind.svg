<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-label="Each seat works in its own clone inside a private state folder; the conductor alone combines their work.">
<title>Each seat works in its own clone inside a private state folder; the conductor alone combines their work.</title>
<style>
.s{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="960" height="372" rx="14" fill="#0c1726"/>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#8da2b9"/></marker></defs>
<text x="28" y="44" class="s" font-size="20" fill="#e9eff6" text-anchor="start" font-weight="600" >How the blind is kept</text>
<text x="28" y="66" class="s" font-size="13" fill="#8da2b9" text-anchor="start" font-weight="400" >Enforced where each CLI can enforce it, audited everywhere. Seats are treated as fallible, not hostile.</text>
<rect x="28" y="150" width="168" height="78" rx="7" fill="#13243b" stroke="#e9eff6"/>
<text x="112.0" y="185.8" class="s" font-size="12.5" fill="#e9eff6" text-anchor="middle" font-weight="400" >your project</text>
<text x="112.0" y="201.2" class="s" font-size="12.5" fill="#e9eff6" text-anchor="middle" font-weight="400" >main + .parallax/ledger</text>
<text x="112" y="250" class="s" font-size="11.5" fill="#8da2b9" text-anchor="middle" font-weight="400" >nothing a seat writes</text>
<text x="112" y="265" class="s" font-size="11.5" fill="#8da2b9" text-anchor="middle" font-weight="400" >enters it until the task lands</text>
<rect x="262" y="150" width="150" height="78" rx="7" fill="#13243b" stroke="#2c4361"/>
<text x="337.0" y="185.8" class="s" font-size="12.5" fill="#e9eff6" text-anchor="middle" font-weight="400" >conductor</text>
<text x="337.0" y="201.2" class="s" font-size="12.5" fill="#e9eff6" text-anchor="middle" font-weight="400" >git, checks, audit</text>
<line x1="196" y1="189" x2="262" y2="189" stroke="#8da2b9" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="478" y="92" width="454" height="226" rx="7" fill="none" stroke="#8da2b9" stroke-dasharray="5 4"/>
<text x="494" y="114" class="m" font-size="12" fill="#c3d0de" text-anchor="start" font-weight="400" >state folder  ~/.parallax/&lt;project key&gt;/&lt;task&gt;</text>
<text x="494" y="130" class="s" font-size="11.5" fill="#8da2b9" text-anchor="start" font-weight="400" >private to your account, SYSTEM and Administrators</text>
<rect x="494" y="146" width="200" height="62" rx="7" fill="#13243b" stroke="#f5b041"/>
<text x="594.0" y="173.8" class="s" font-size="12" fill="#e9eff6" text-anchor="middle" font-weight="400" >claude&#x27;s clone</text>
<text x="594.0" y="188.8" class="s" font-size="12" fill="#e9eff6" text-anchor="middle" font-weight="400" >file tools only, no shell</text>
<rect x="716" y="146" width="200" height="62" rx="7" fill="#13243b" stroke="#5cc8f2"/>
<text x="816.0" y="173.8" class="s" font-size="12" fill="#e9eff6" text-anchor="middle" font-weight="400" >codex&#x27;s clone</text>
<text x="816.0" y="188.8" class="s" font-size="12" fill="#e9eff6" text-anchor="middle" font-weight="400" >workspace-write sandbox</text>
<line x1="705" y1="142" x2="705" y2="212" stroke="#e9eff6" stroke-width="1.6" stroke-dasharray="2 4" />
<rect x="494" y="232" width="422" height="62" rx="7" fill="#13243b" stroke="#2c4361"/>
<text x="705.0" y="259.8" class="s" font-size="12" fill="#e9eff6" text-anchor="middle" font-weight="400" >crossing, mutants, artifacts</text>
<text x="705.0" y="274.8" class="s" font-size="12" fill="#e9eff6" text-anchor="middle" font-weight="400" >the conductor&#x27;s alone: both seats&#x27; work meets here</text>
<line x1="412" y1="175" x2="478" y2="175" stroke="#8da2b9" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="478" y1="203" x2="412" y2="203" stroke="#8da2b9" stroke-width="1.3" marker-end="url(#a)"/>
<text x="445" y="168" class="s" font-size="11" fill="#8da2b9" text-anchor="middle" font-weight="400" >briefs</text>
<text x="445" y="218" class="s" font-size="11" fill="#8da2b9" text-anchor="middle" font-weight="400" >events</text>
<text x="28" y="318" class="s" font-size="12" fill="#c3d0de" text-anchor="start" font-weight="400" >Seal: readings and attempts are hashed into the ledger before the reveal.</text>
<text x="28" y="337" class="s" font-size="12" fill="#c3d0de" text-anchor="start" font-weight="400" >Audit: each event stream is scanned for the other seat&#x27;s paths. Best effort.</text>
<text x="28" y="356" class="s" font-size="12" fill="#c3d0de" text-anchor="start" font-weight="400" >Voiding: a hit discards the attempt, its session and its clone. The rerun starts from the contract alone.</text>
</svg>
