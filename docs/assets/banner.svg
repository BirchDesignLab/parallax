<text x="30" y="30" class="s" font-size="14" fill="#f5b041" text-anchor="start" font-weight="400" >one model builds</text>
<text x="930" y="30" class="s" font-size="14" fill="#5cc8f2" text-anchor="end" font-weight="400" >the other checks, blind</text>
<text x="480.0" y="100" class="s" font-size="13" fill="#8da2b9" text-anchor="middle" font-weight="400" >the crossing</text>
<text x="480.0" y="276" class="s" font-size="19" fill="#e9eff6" text-anchor="middle" font-weight="400" >Two different models on every change. Their agreement is the evidence.</text>
<text x="480.0" y="304" class="s" font-size="15" fill="#8da2b9" text-anchor="middle" font-weight="400" >Their disagreement is the only thing that reaches you.</text>
