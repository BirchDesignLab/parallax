<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-label="Four routes from the reveals: no dispute, one objection, several objections or a conflict, and a refused proposal.">
<title>Four routes from the reveals: no dispute, one objection, several objections or a conflict, and a refused proposal.</title>
<style>
.s{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="960" height="432" rx="14" fill="#0c1726"/>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="#8da2b9"/></marker></defs>
<text x="28" y="44" class="s" font-size="20" fill="#e9eff6" text-anchor="start" font-weight="600" >How a disagreement reaches you</text>
<text x="28" y="66" class="s" font-size="13" fill="#8da2b9" text-anchor="start" font-weight="400" >After the reveals, how much the seats disagree decides the route.</text>
<circle cx="92" cy="221.0" r="5" fill="#e9eff6"/>
<text x="92" y="245.0" class="s" font-size="12.5" fill="#8da2b9" text-anchor="middle" font-weight="400" >reveals</text>
<path d="M92 221.0 C162 221.0 142 110 212 110" fill="none" stroke="#2c4361" stroke-width="1.5"/>
<text x="224" y="106" class="s" font-size="13.5" fill="#e9eff6" text-anchor="start" font-weight="600" >nothing in dispute</text>
<text x="224" y="124" class="s" font-size="12" fill="#8da2b9" text-anchor="start" font-weight="400" >the contract freezes</text>
<line x1="644" y1="110" x2="706" y2="110" stroke="#2c4361" stroke-width="1.4" marker-end="url(#a)"/>
<text x="718" y="115" class="s" font-size="13.5" fill="#8da2b9" text-anchor="start" font-weight="600" >no card</text>
<path d="M92 221.0 C162 221.0 142 184 212 184" fill="none" stroke="#2c4361" stroke-width="1.5"/>
<text x="224" y="180" class="s" font-size="13.5" fill="#e9eff6" text-anchor="start" font-weight="600" >one objection</text>
<text x="224" y="198" class="s" font-size="12" fill="#8da2b9" text-anchor="start" font-weight="400" >both answers, both reasons, the case that splits them</text>
<line x1="644" y1="184" x2="706" y2="184" stroke="#2c4361" stroke-width="1.4" marker-end="url(#a)"/>
<text x="718" y="189" class="s" font-size="13.5" fill="#e9eff6" text-anchor="start" font-weight="600" >one card</text>
<path d="M92 221.0 C162 221.0 142 258 212 258" fill="none" stroke="#2c4361" stroke-width="1.5"/>
<text x="224" y="254" class="s" font-size="13.5" fill="#e9eff6" text-anchor="start" font-weight="600" >several, or two provisions conflict</text>
<text x="224" y="272" class="s" font-size="12" fill="#8da2b9" text-anchor="start" font-weight="400" >one more exchange: the builder proposes one account,</text>
<line x1="644" y1="258" x2="706" y2="258" stroke="#2c4361" stroke-width="1.4" marker-end="url(#a)"/>
<text x="718" y="254" class="s" font-size="13.5" fill="#e9eff6" text-anchor="start" font-weight="600" >a card only where each</text>
<text x="224" y="287" class="s" font-size="12" fill="#8da2b9" text-anchor="start" font-weight="400" >the challenger reviews exactly that</text>
<text x="718" y="272" class="s" font-size="13.5" fill="#e9eff6" text-anchor="start" font-weight="600" >holds a different answer</text>
<path d="M92 221.0 C162 221.0 142 332 212 332" fill="none" stroke="#2c4361" stroke-width="1.5"/>
<text x="224" y="328" class="s" font-size="13.5" fill="#e9eff6" text-anchor="start" font-weight="600" >a seat refuses the proposal</text>
<text x="224" y="346" class="s" font-size="12" fill="#8da2b9" text-anchor="start" font-weight="400" >both agree what a ruling would have to replace</text>
<line x1="644" y1="332" x2="706" y2="332" stroke="#2c4361" stroke-width="1.4" marker-end="url(#a)"/>
<text x="718" y="337" class="s" font-size="13.5" fill="#e9eff6" text-anchor="start" font-weight="600" >one card: replace or drop</text>
<text x="28" y="416" class="s" font-size="12" fill="#8da2b9" text-anchor="start" font-weight="400" >If the seats cannot agree on what a ruling would replace, the task is blocked and status says why. Nothing is built until every card is ruled.</text>
</svg>
